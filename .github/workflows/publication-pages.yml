# Publication de la version construite de SPLEAD sur GitHub Pages
# (adresse : https://mmouctar34.github.io/elite-221/), pour les essais sur téléphone.
# Se déclenche à chaque envoi sur main, ou à la main depuis l'onglet Actions.
# Prérequis (une seule fois) : Settings > Pages > Source = « GitHub Actions ».
name: Publication Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publication-pages
  cancel-in-progress: false

jobs:
  construire:
    name: Tester et construire pour /elite-221/
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Installer les bibliotheques
        run: npm ci

      - name: Tests automatiques (on ne publie jamais une version qui echoue)
        run: npm test

      - name: Construction pour le sous-dossier /elite-221/
        run: npm run build
        env:
          SPLEAD_BASE: /elite-221/

      - name: Page de secours (adresse inconnue renvoyee vers l'application)
        run: cp dist/index.html dist/404.html

      - name: Taille du code charge a la premiere ouverture
        run: npm run taille

      - name: Preparer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Envoyer la version construite
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  publier:
    name: Publier sur GitHub Pages
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - name: Publier
        id: publication
        uses: actions/deploy-pages@v4
